name: toolkit-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tools and scripts parse on the target interpreter
        run: python3 -m compileall -q tools scripts

      - name: Codex skills mirror is in sync with skills/
        run: python3 scripts/sync-codex-skills.py --check

      - name: Codex prompts mirror is in sync with skills/
        run: python3 scripts/sync-codex-prompts.py --check

      - name: Toolkit surface is CJK-free
        run: python3 scripts/check-no-cjk.py

      - name: Claude commands install cleanly
        run: |
          dest="$(mktemp -d)"
          CLAUDE_COMMANDS_DIR="$dest" ./scripts/install-claude-commands.sh
          installed="$(ls "$dest"/*.md | wc -l)"
          expected="$(ls skills/*.md | wc -l)"
          echo "installed=$installed expected=$expected"
          test "$installed" -eq "$expected"
